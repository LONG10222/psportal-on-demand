name: Preserve verified router test archives
on:
  push:
    branches: [archive/router-sources-20261025]
permissions:
  contents: read
concurrency:
  group: preserve-router-sources-20261025
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify and preserve original artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
