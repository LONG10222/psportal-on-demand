name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Protocol and configuration tests
        run: |
          lua5.1 tests/unit.lua
          lua5.1 tests/access.lua
          lua5.1 tests/dns.lua
          lua5.1 tests/ownership.lua
          lua5.1 tests/lifecycle.lua
          lua5.1 tests/selection.lua
          lua5.1 tests/subscription.lua
          lua5.1 tests/node_api.lua
          lua5.1 tests/luci.lua
      - name: Installer and repository checks
        run: python3 tests/packaging.py
      - name: Verify StarPass icons and platform branding
        run: |
          python3 native/scripts/generate_brand_assets.py --verify
          python3 -m unittest discover -s native/scripts -p test_brand_assets.py -v
