name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Protocol and configuration tests
        run: lua5.1 tests/unit.lua
      - name: Installer and repository checks
        run: python3 tests/packaging.py
