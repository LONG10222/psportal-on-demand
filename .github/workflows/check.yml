name: checks
on:
  push:
  pull_request:
env:
  PSPORTAL_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
jobs:
  unit-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 ruby
      - name: Protocol and configuration tests
        run: |
          lua5.1 tests/unit.lua
          lua5.1 tests/access.lua
          lua5.1 tests/dns.lua
          lua5.1 tests/ownership.lua
          lua5.1 tests/lifecycle.lua
          lua5.1 tests/selection.lua
          lua5.1 tests/subscription.lua
          lua5.1 tests/node_api.lua
          lua5.1 tests/openclash.lua
          LUA_PATH="src/?.lua;;" lua5.1 tests/luci.lua
          LUA_PATH="src/?.lua;;" lua5.1 tests/workspaces.lua
          lua5.1 tests/status.lua
          lua5.1 tests/configure.lua
          lua5.1 tests/service_status.lua
          lua5.1 tests/dashboard_api.lua
      - name: Xianniu router tests
        run: |
          cd integrations/xianniu-router
          python3 build_ipk.py
          node tests/member-clock.js
          PYTHONPATH=src:. python3 -m unittest discover -s tests -v
      - name: Installer and repository checks
        run: |
          python3 tests/packaging.py
          python3 tests/coexistence.py
          python3 tests/gateway.py
          python3 tests/monitoring.py
          node tests/dashboard-traffic.js
      - name: Verify StarPass icons and platform branding
        run: |
          python3 native/scripts/generate_brand_assets.py --verify
          python3 -m unittest discover -s native/scripts -p test_brand_assets.py -v
      - name: Build deterministic router source bundle (no core or credentials)
        run: |
          python3 scripts/build-router-source.py "$RUNNER_TEMP/starpass-router-source.tar.gz" > "$RUNNER_TEMP/starpass-router-source.sha256"
          python3 scripts/build-router-source.py "$RUNNER_TEMP/starpass-router-source-second.tar.gz"
          cmp "$RUNNER_TEMP/starpass-router-source.tar.gz" "$RUNNER_TEMP/starpass-router-source-second.tar.gz"
          python3 scripts/build-router-ipk.py "$RUNNER_TEMP/luci-app-starpass.ipk" --version "0.4.3+git${PSPORTAL_SOURCE_COMMIT:0:12}-1" > "$RUNNER_TEMP/luci-app-starpass.sha256"
      - name: Upload reviewed router source installer
        uses: actions/upload-artifact@v4
        with:
          name: starpass-router-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/starpass-router-source.tar.gz
            ${{ runner.temp }}/starpass-router-source.sha256
            ${{ runner.temp }}/luci-app-starpass.ipk
            ${{ runner.temp }}/luci-app-starpass.sha256
            integrations/xianniu-router/xianniu-router_0.5.1_all.ipk
            integrations/xianniu-router/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
