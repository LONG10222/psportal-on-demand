# SPDX-License-Identifier: GPL-3.0-only
name: Native Android Unsigned
'on':
  workflow_dispatch:
    inputs:
      install_sdk_packages:
        description: 'Install exact official SDK packages using an already accepted SDK license'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'native/engine/**'
      - 'native/mobile/**'
      - 'native/androidcore/**'
      - 'native/androidmobile/**'
      - 'native/third_party/**'
      - 'native/android/**'
      - 'native/scripts/**'
      - 'native/go.mod'
      - 'native/go.sum'
      - 'native/ci/android-unsigned.yml.example'
      - '.github/workflows/android-unsigned.yml'
permissions:
  contents: read
concurrency:
  group: android-unsigned-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unsigned:
    # Standard free public-repository runner, never a larger or private runner.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2 -buildvcs=false'
      GOTOOLCHAIN: local
      PSPORTAL_INSTALL_SDK: ${{ (github.event_name == 'pull_request' || inputs.install_sdk_packages) && '1' || '0' }}
    steps:
      - name: Check out without persisting credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Build and audit real unsigned APK with matching source
        run: bash native/android/tools/ci-unsigned.sh
      - name: Upload APK, licenses, corresponding source and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psportal-android-unsigned-${{ github.sha }}
          path: native/dist/android-unsigned/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload build and lint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psportal-android-diagnostics-${{ github.sha }}
          path: |
            native/android/build/ci-build.log
            native/android/build/reports/*.json
            native/android/build/reports/compiled-manifest.txt
            native/android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 1
