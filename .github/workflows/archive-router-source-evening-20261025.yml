ecture-independent IPKs where present. NOT Windows binaries or runtime diagnostics. Original successful checks ZIPs preserved separately by run ID. Exact source Git blobs, MIT license and internal checksums verified before publication. CI checks cover repository protocol/configuration, installer/packaging and branding only; not packaged desktop or real-device/game validation. Historical rerun archives do not replace existing releases."},{"sha":"905ecc5d375fa8ae0756a88392d3380bb0ec1729","tag":"starpass-router-rerun-20261025-905ecc5","runs":[40215370543],"artifacts":[{"id":12606569963,"node_id":"MDg6QXJ0aWZhY3QxMjYwNjU2OTk2Mw==","name":"starpass-router-source-905ecc5d375fa8ae0756a88392d3380bb0ec1729","size_in_bytes":166032,"url":"https://api.github.com/repos/LONG10222/psportal-on-demand/actions/artifacts/12606569963","archive_download_url":"https://api.github.com/repos/LONG10222/psportal-on-demand/actions/artifacts/12606569963/zip","expired":false,"digest":"sha256:1fc0f38478b848d1b5441120f3e25f271bec1ce3c5cc4b81d294d0e32ed460d4","created_at":"2026-10-25T17:13:08Z","updated_at":"2026-10-25T17:13:08Z","expires_at":"2026-11-01T17:13:07Z","workflow_run":{"id":40215370543,"repository_id":1423882635,"head_repository_id":1423882635,"head_branch":"feat/router-workspaces-device-notes","head_sha":"905ecc5d375fa8ae0756a88392d3380bb0ec1729"}}],"note":"Router original test bundles: source archives, and paired architecture-independent IPKs where present. NOT Windows binaries or runtime diagnostics. Original successful checks ZIPs preserved separately by run ID. Exact source Git blobs, MIT license and internal checksums verified before publication. CI checks cover repository protocol/configuration, installer/packaging and branding only; not packaged desktop or real-device/game validation. Historical rerun archives do not replace existing releases."}]
          CONFIG
          cat > archive.py <<'PYTHON'
          import os,json,urllib.request,urllib.error,urllib.parse,hashlib,zipfile,tarfile,io,pathlib
          REPO='LONG10222/psportal-on-demand'; BASE='https://api.github.com/repos/'+REPO
          class Redirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            assert urllib.parse.urlparse(newurl).scheme=='https'
            r=super().redirect_request(req,fp,code,msg,headers,newurl)
            if r and urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:r.remove_header('Authorization')
            return r
          opener=urllib.request.build_opener(Redirect())
          def request(url,method='GET',data=None):
           assert url.startswith(('https://api.github.com/','https://uploads.github.com/'))
           headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'StarPass-preserve-originals','X-GitHub-Api-Version':'2022-11-28'}
           if data is not None:
            if isinstance(data,bytes):headers['Content-Type']='application/octet-stream'
            else:headers['Content-Type']='application/json';data=json.dumps(data).encode()
           return opener.open(urllib.request.Request(url,headers=headers,data=data,method=method),timeout=120)
          def api(path,method='GET',data=None):
           with request(BASE+path,method,data) as r:return json.load(r)
          def optional(path):
           try:return api(path)
           except urllib.error.HTTPError as e:
            if e.code==404:return None
            raise
          baseline=api('/releases?per_page=100')
          assert len(baseline)<100
          baseline_assets={r['id']:{a['id']:(a['name'],a['size'],a.get('digest')) for a in r['assets']} for r in baseline}
          for cfg in json.loads(pathlib.Path('config.json').read_text()):
           sha=cfg['sha'];tag=cfg['tag'];out=pathlib.Path(tag);out.mkdir(exist_ok=True)
           tree=api('/git/trees/'+sha+'?recursive=1');assert not tree['truncated'];blobs={x['path']:x['sha'] for x in tree['tree'] if x['type']=='blob'}
           prov={'repository':REPO,'source_commit':sha,'note':cfg['note'],'artifacts':[]};expected={};payloads=[]
           for orig in cfg['artifacts']:
            a=api('/actions/artifacts/'+str(orig['id']));runid=a['workflow_run']['id'];run=api('/actions/runs/'+str(runid));jobpage=api('/actions/runs/'+str(runid)+'/jobs?per_page=100');jobs=jobpage['jobs'];assert jobpage['total_count']==len(jobs)
            assert a['id']==orig['id'] and a['name']==orig['name'] and runid==orig['workflow_run']['id'] and runid in cfg['runs']
            assert run['repository']['full_name']==REPO
            assert a['digest']==orig['digest'] and a['size_in_bytes']==orig['size_in_bytes'] and not a['expired']
            assert a['workflow_run']['head_sha']==sha and run['head_sha']==sha and run['conclusion']=='success'
            assert jobs and all(j['conclusion']=='success' for j in jobs)
            with request(BASE+'/actions/artifacts/'+str(a['id'])+'/zip') as r:b=r.read()
            assert len(b)==a['size_in_bytes'] and 'sha256:'+hashlib.sha256(b).hexdigest()==a['digest']
            z=zipfile.ZipFile(io.BytesIO(b));assert z.testzip() is None and len(set(z.namelist()))==len(z.namelist())
            inner={pathlib.PurePosixPath(n).name:z.read(n) for n in z.namelist() if not n.endswith('/')};assert len(inner)==len([n for n in z.namelist() if not n.endswith('/')]);payloads.append({n:hashlib.sha256(v).hexdigest() for n,v in inner.items()})
            for n,v in inner.items():
             if n.endswith('.sha256') or n=='SHA256SUMS':
              for line in v.decode().splitlines():
               h,f=line.split(None,1);assert hashlib.sha256(inner[f.strip()]).hexdigest()==h
            t=tarfile.open(fileobj=io.BytesIO(inner['starpass-router-source.tar.gz']));src={m.name.split('/',1)[1]:t.extractfile(m).read() for m in t if m.isfile()}
            for n,v in src.items():
             if n=='SHA256SUMS':continue
             assert blobs[n]==hashlib.sha1(b'blob '+str(len(v)).encode()+b'\0'+v).hexdigest(),n
            for line in src['SHA256SUMS'].decode().splitlines():
             h,n=line.split(None,1);assert hashlib.sha256(src[n.strip().removeprefix('./')]).hexdigest()==h
            def tarfiles(data):
             tt=tarfile.open(fileobj=io.BytesIO(data));members=tt.getmembers();assert all(not m.issym() and not m.islnk() for m in members)
             return {m.name.removeprefix('./'):tt.extractfile(m).read() for m in members if m.isfile()}
            for ipkname,ipkbytes in inner.items():
             if not ipkname.endswith('.ipk'):continue
             package=tarfiles(ipkbytes);assert set(package)=={'debian-binary','control.tar.gz','data.tar.gz'} and package['debian-binary']==b'2.0\n'
             datafiles=tarfiles(package['data.tar.gz']);controls=tarfiles(package['control.tar.gz']);assert datafiles and controls
             for fn,fb in datafiles.items():
              blob=hashlib.sha1(b'blob '+str(len(fb)).encode()+b'\0'+fb).hexdigest();assert blob in blobs.values(), 'IPK source mismatch '+fn
             assert b'Architecture: all\n' in controls['control']
             assert set(controls)<={'control','conffiles','preinst','postinst','prerm','postrm'}
             print('IPK_PAYLOAD_GIT_VERIFIED',ipkname,len(datafiles),flush=True)
            assert b'MIT License' in src['LICENSE'];(out/'LICENSE.txt').write_bytes(src['LICENSE'])
            name=a['name']+'-run'+str(runid)+'.zip';(out/name).write_bytes(b)
            prov['artifacts'].append({'id':a['id'],'run_id':runid,'run_url':run['html_url'],'name':name,'original_name':a['name'],'sha256':a['digest'],'size':len(b),'inner_sha256':payloads[-1],'source_files_matched_to_git':len(src)-1,'zip_crc':'passed','internal_checksums':'passed','jobs':[{'name':j['name'],'conclusion':j['conclusion'],'steps':[{'name':s['name'],'conclusion':s['conclusion']} for s in j['steps']]} for j in jobs]})
           if len(payloads)>1:assert all(p==payloads[0] for p in payloads)
           (out/'archive-provenance.json').write_text(json.dumps(prov,indent=2)+'\n')
           allowed={a['name']+'-run'+str(a['workflow_run']['id'])+'.zip' for a in cfg['artifacts']}|{'LICENSE.txt','archive-provenance.json','SHA256SUMS.txt'}
           assert {p.name for p in out.iterdir()} <= allowed
           (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.name!='SHA256SUMS.txt'))
           assert {p.name for p in out.iterdir()} == allowed
           for p in (out/n for n in sorted(allowed)):expected[p.name]=(p.stat().st_size,'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest())
           releases=api('/releases?per_page=100');matches=[r for r in releases if r['tag_name']==tag];assert len(matches)<=1
           ref=optional('/git/ref/tags/'+tag)
           if not ref:ref=api('/git/refs','POST',{'ref':'refs/tags/'+tag,'sha':sha})
           assert ref['object']['type']=='commit' and ref['object']['sha']==sha
           body=cfg['note']+'\n\nExact source commit: '+sha+'\n\nOriginal Actions ZIPs preserved without rebuilding. Outer SHA256/size, ZIP CRC, embedded checksums, and every source-file Git blob verified. Original source and MIT license retained. CI protocol/configuration, installer/packaging, branding and deterministic-bundle steps succeeded; see archive-provenance.json.\n\nTEST PRE-RELEASE ONLY. No claim of complete physical PS Portal/game/UDP, target-device reboot, long-run or independent live-subscription acceptance. No merge to main, no old releases/branches replaced. Release assets are independent of Actions retention, subject to repository/asset deletion.'
           release=matches[0] if matches else api('/releases','POST',{'tag_name':tag,'target_commitish':sha,'name':'StarPass router test archive '+tag,'body':body,'draft':True,'prerelease':True,'make_latest':'false'})
           assert release['target_commitish']==sha and release['prerelease']
           assets={a['name']:a for a in api('/releases/'+str(release['id'])+'/assets?per_page=100')}
           if not release['draft']:
            assert set(assets)==set(expected) and all((a['size'],a['digest'],a['state'])==(*expected[n],'uploaded') for n,a in assets.items()), 'Published release is immutable to this task'
           for name,(size,digest) in expected.items():
            if name in assets:assert (assets[name]['size'],assets[name]['digest'])==(size,digest);continue
            with request(release['upload_url'].split('{')[0]+'?name='+urllib.parse.quote(name),'POST',(out/name).read_bytes()) as r:a=json.load(r)
            assert (a['size'],a['digest'],a['state'])==(size,digest,'uploaded')
           assets=api('/releases/'+str(release['id'])+'/assets?per_page=100');assert len(assets)==len(expected)
           for a in assets:assert (a['size'],a['digest'])==expected[a['name']] and a['state']=='uploaded'
           assert api('/git/ref/tags/'+tag)['object']['sha']==sha
           if release['draft']:release=api('/releases/'+str(release['id']),'PATCH',{'draft':False,'prerelease':True,'make_latest':'false'})
           assert not release['draft'] and release['prerelease']
           for a in api('/releases/'+str(release['id'])+'/assets?per_page=100'):
            with urllib.request.urlopen(a['browser_download_url'],timeout=90) as r:b=r.read()
            assert (len(b),'sha256:'+hashlib.sha256(b).hexdigest())==expected[a['name']]
           print('ARCHIVE_VERIFIED',release['html_url'],sum(x[0] for x in expected.values()),flush=True)
          
          for rid,expected_old in baseline_assets.items():
           actual={a['id']:(a['name'],a['size'],a.get('digest')) for a in api('/releases/'+str(rid)+'/assets?per_page=100')}
           assert actual==expected_old, 'Old release assets changed'
          print('OLD_RELEASES_UNCHANGED',len(baseline_assets),flush=True)
          
          PYTHON
          python3 archive.py
